name: Release (publish to public repo)

# Manually triggered. You supply the public target repository (the one you push
# upstream and publish on Packagist), and the workflow publishes an allowlisted
# snapshot to it as a single squashed "release" commit authored by you.
#
# Required secret:
#   UPSTREAM_TOKEN — a Personal Access Token with "Contents: Read and write" on
#                    the target repository. See .github/release/README.md.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Public target repository (owner/name)"
        required: true
        default: "maciej-kosiedowski/Colnect-API-Client"
      target_branch:
        description: "Branch in the target repo to publish to"
        required: true
        default: "master"
      version:
        description: "Optional version, e.g. 1.0.0 (when set, an annotated tag is pushed to the target)"
        required: false
        default: ""

# The job only reads this (source) repo via GITHUB_TOKEN; pushing to the target
# uses UPSTREAM_TOKEN, so no write scope is needed here.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source (private) repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate composer.json (Packagist compliance)
        run: composer validate --strict --no-check-lock

      - name: Publish allowlisted snapshot
        env:
          # Inputs are passed via env (never interpolated into the shell) to
          # prevent script injection from workflow inputs.
          SOURCE_DIR: ${{ github.workspace }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: release
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: bash .github/release/publish.sh
